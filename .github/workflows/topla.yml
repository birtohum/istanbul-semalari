name: topla
# Uzun koşu: ~5,5 saat boyunca 4 dakikada bir anlık görüntü alır, kaydeder, yayın işini tetikler;
# bitince kendini yeniden başlatır. GitHub'ın zamanlanmış işleri yeni depolarda saatlerce gecikebildiği
# (ölçüm: 4 Kas 2026, ilk 30+ dakikada hiç koşu yok) için cron yalnız zincir koparsa diye yedek.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Döngü
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bitis=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$bitis" ]; do
            bas=$(date +%s)
            git pull -q --rebase || true
            python topla.py || true
            python ozetle.py
            git add veri/ornekler site/veri
            if ! git diff --cached --quiet; then
              git commit -q -m "veri: $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
              gh workflow run yayin.yml --ref main || true
            fi
            bekle=$(( 240 - ($(date +%s) - bas) ))
            [ "$bekle" -gt 0 ] && sleep "$bekle"
          done
      - name: Zinciri sürdür
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run topla.yml --ref main
